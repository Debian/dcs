// vim:ts=2:sw=2:et
syntax = "proto3";

package sourcebackendpb;

option go_package = "github.com/Debian/dcs/internal/proto/sourcebackendpb";

message FileRequest {
  string path = 1;
}

message FileReply {
  bytes contents = 1;
}

message SearchRequest {
  string query = 1;

  // The query_id that dcs-web assigned. Will be logged,
  // which is convenient when joining dcs-web + source-backend logs.
  string query_id = 4;

  // Rewritten URL (after RewriteQuery()) with all the parameters that
  // are relevant for ranking.
  string rewritten_url = 2;

  bool literal = 3;
}

message Match {
  string path = 1;
  uint32 line = 2;

  // Contents of line-2.
  string ctxp2 = 3;
  // Contents of line-1.
  string ctxp1 = 4;
  // Contents of the line containing the match.
  string context = 5;
  // Contents of line+1.
  string ctxn1 = 6;
  // Contents of line+2.
  string ctxn2 = 7;

  float pathrank = 8;
  float ranking = 9;
  string package = 10;
}

message ProgressUpdate {
  uint64 files_processed = 1;
  uint64 files_total = 2;
}

// SearchStats describes the work a source backend did for one query.
// It is sent once, on the last SearchReply.
message SearchStats {
  // Number of candidate files.
  uint64 candidates = 1;

  // Number of candidate files that were actually searched
  // (less than candidates when the query was cancelled).
  uint64 searched = 2;

  // Bytes read from the searched files.
  uint64 read_bytes = 3;

  // Number of matches sent.
  uint64 matches = 4;

  // Time spent on the index query (including waiting for the index lock).
  int64 index_ns = 5;

  // Time spent searching the candidate files.
  int64 grep_ns = 6;

  // The single file that took longest to search.
  string slowest_path = 7;
  int64 slowest_ns = 8;

  // Whether the context was cancelled before the query completed.
  bool cancelled = 9;
}

message SearchReply {
  enum Type {
    MATCH = 0;
    PROGRESS_UPDATE = 1;
    STATS = 2;
  }
  Type type = 1;

  Match match = 2;
  ProgressUpdate progress_update = 3;
  SearchStats stats = 4;
}

message ReplaceIndexRequest {
  string replacement_path = 1;
}

message ReplaceIndexReply {
}

// SourceBackend searches/displays source files.
service SourceBackend {
  // File reads the file and returns its contents.
  rpc File(FileRequest) returns (FileReply) {}

  // Search performs the given query and streams matches/progress updates.
  rpc Search(SearchRequest) returns (stream SearchReply) {}

  // Replaces the loaded index with the specified replacement index. On a file
  // system level, the specified file is mv'ed to the file specified by
  // -index_path.
  rpc ReplaceIndex(ReplaceIndexRequest) returns (ReplaceIndexReply) {}
}
